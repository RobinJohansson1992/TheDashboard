<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TheDashboard</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body onload="(TimeNow(), DateNow())">
    <header>
      <div class="headerBox">
        <div class="time-box">
          <div id="show-time"></div>
          <div id="show-date"></div>
        </div>
      </div>
    </header>

      <div class="addLink hidden" id="popup">
        <h2>Lägg till snabblänk:</h2>
        <p></p>
        <input
          type="text"
          placeholder="Ange länkadress..."
          class="addLinkInputs"
          id="linkInput"
        />
        <input
          type="text"
          placeholder="Ange namn..."
          class="addLinkInputs"
          id="nameInput"
        />
        <button id="addBtn">Lägg till</button>
        <button id="closeBtn">Stäng</button>
      </div>

      <div class="pageHeader">
        <h1 id="headerInput" spellcheck = "false">John Doe Dashboard</h1>
      </div>
      <section class="cardBox">
        <div class="card" id="linkCard">
          <div class="links">
            <h2>Snabblänkar</h2>
            <div id="linkList">
                
                <div class="bigLinkRemoveButton">
              </div>
            </div>
          </div>
          <a href="" id="addLinkBtn">+ Lägg till länk</a>
        </div>

        <div class="card" id="weatherCard">
          <h2>Dagens väder</h2>
          <div id="weatherList"></div>
        </div>

        <div class="card" id="shopCard">
          <h2>Nyheter</h2>
          <div id="newsList">
          </div>
          <a href="" id="refreshBtn">Uppdatera</a>
        </div>

        <div class="card" id="notesCard">
          <h2>Anteckningar</h2>
          <textarea spellcheck = "false" name="" id="notes"></textarea>
        </div>
      </section>
    </body>

    <footer>
      <div class="footerBox">
        <a href="">
        <p>⭮</p>
          
          Slumpa ny bakgrund</a>
      </div>
    </footer>
  </body>
</html>
